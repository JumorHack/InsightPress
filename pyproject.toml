[project]
name = "insightpress"
version = "0.1.0"
description = "AI book review generator: PDF in, structured Markdown review out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "anthropic>=0.40",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "sse-starlette>=2.0",
    "python-dotenv>=1.0",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
